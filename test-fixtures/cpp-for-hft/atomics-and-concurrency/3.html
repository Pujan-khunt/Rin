<div class="m-quiz">
  <div class="m-time-elapsed" style="width: 8.28%"></div>
  <div class="m-quiz__main">
    <div class="m-quiz__main-inner">
      <h1 class="dark bold">Quiz time!</h1>
      <div class="m-quiz-timer">
        <i class="icon-clock m-r-10"></i
        ><span class="bold">Time Left: 27s</span>
      </div>
      <div class="m-quiz__problem">
        <div class="m-problem-description m-b-20">
          <div class="md-renderer m-problem-description__markdown">
            <p>what is the linux format of an executable ?</p>
          </div>
        </div>
        <div class="m-quiz__choices relative">
          <div class="m-problem-choices">
            <div class="hint h5 m-b-10 text-c">
              Click on an option to submit your answer
            </div>
            <div class="m-problem-choices__list">
              <a class="tappable choice choice--default m-5"
                ><div class="choice__name">A</div>
                <div class="choice__text">
                  <div class="md-renderer relative"><p>ELF</p></div>
                </div></a
              ><a class="tappable choice choice--default m-5"
                ><div class="choice__name">B</div>
                <div class="choice__text">
                  <div class="md-renderer relative"><p>.exe</p></div>
                </div></a
              ><a class="tappable choice choice--default m-5"
                ><div class="choice__name">C</div>
                <div class="choice__text">
                  <div class="md-renderer relative"><p>.so</p></div>
                </div></a
              >
            </div>
          </div>
        </div>
        <div class="m-quiz__small-text m-t-5 italic">
          (Since you've already attempted the quiz before,<br />this attempt
          wouldn't update your score)
        </div>
      </div>
    </div>
  </div>
</div>
